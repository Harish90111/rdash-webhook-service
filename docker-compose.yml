version: '3.8'

x-app-environment: &app-environment
  APP_ENV: "${APP_ENV:-development}"
  DEBUG: "${DEBUG:-True}"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}"
  CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-django-insecure-change-this-in-production}"
  POSTGRES_DB: "${POSTGRES_DB:-rdash_webhooks}"
  POSTGRES_USER: "${POSTGRES_USER:-postgres}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
  POSTGRES_PORT: "5432"
  DB_CONN_MAX_AGE: "${DB_CONN_MAX_AGE:-60}"
  DB_CONN_HEALTH_CHECKS: "${DB_CONN_HEALTH_CHECKS:-True}"
  DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-10}"
  POSTGRES_SSLMODE: "${POSTGRES_SSLMODE:-}"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: "${CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP:-True}"
  CELERY_BROKER_POOL_LIMIT: "${CELERY_BROKER_POOL_LIMIT:-10}"
  CELERY_BROKER_HEARTBEAT: "${CELERY_BROKER_HEARTBEAT:-30}"
  CELERY_VISIBILITY_TIMEOUT: "${CELERY_VISIBILITY_TIMEOUT:-3600}"
  CELERY_TASK_TRACK_STARTED: "${CELERY_TASK_TRACK_STARTED:-True}"
  CELERY_WORKER_PREFETCH_MULTIPLIER: "${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}"
  CELERY_WORKER_CONCURRENCY: "${CELERY_WORKER_CONCURRENCY:-2}"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "${CELERY_WORKER_MAX_TASKS_PER_CHILD:-500}"
  CELERY_WORKER_MAX_MEMORY_PER_CHILD: "${CELERY_WORKER_MAX_MEMORY_PER_CHILD:-0}"
  CELERY_WORKER_SEND_TASK_EVENTS: "${CELERY_WORKER_SEND_TASK_EVENTS:-False}"
  CELERY_TASK_TIME_LIMIT: "${CELERY_TASK_TIME_LIMIT:-300}"
  CELERY_TASK_SOFT_TIME_LIMIT: "${CELERY_TASK_SOFT_TIME_LIMIT:-240}"
  CELERY_TASK_DEFAULT_QUEUE: "${CELERY_TASK_DEFAULT_QUEUE:-webhooks.default}"
  CELERY_TASK_DEFAULT_RETRY_DELAY: "${CELERY_TASK_DEFAULT_RETRY_DELAY:-60}"
  CELERY_TASK_MAX_RETRIES: "${CELERY_TASK_MAX_RETRIES:-3}"
  CELERY_BEAT_MAX_LOOP_INTERVAL: "${CELERY_BEAT_MAX_LOOP_INTERVAL:-30}"
  WEBHOOK_CONNECT_TIMEOUT: "${WEBHOOK_CONNECT_TIMEOUT:-5}"
  WEBHOOK_READ_TIMEOUT: "${WEBHOOK_READ_TIMEOUT:-15}"
  WEBHOOK_MAX_RETRIES: "${WEBHOOK_MAX_RETRIES:-5}"
  WEBHOOK_BASE_RETRY_DELAY: "${WEBHOOK_BASE_RETRY_DELAY:-1.0}"
  WEBHOOK_MAX_RETRY_DELAY: "${WEBHOOK_MAX_RETRY_DELAY:-60.0}"
  WEBHOOK_RETRY_JITTER: "${WEBHOOK_RETRY_JITTER:-0.1}"
  WEBHOOK_FANOUT_BATCH_SIZE: "${WEBHOOK_FANOUT_BATCH_SIZE:-100}"
  WEBHOOK_OUTBOX_DISPATCH_BATCH_SIZE: "${WEBHOOK_OUTBOX_DISPATCH_BATCH_SIZE:-100}"
  WEBHOOK_OUTBOX_STALE_LOCK_SECONDS: "${WEBHOOK_OUTBOX_STALE_LOCK_SECONDS:-300}"
  WEBHOOK_OUTBOX_BASE_RETRY_DELAY: "${WEBHOOK_OUTBOX_BASE_RETRY_DELAY:-1.0}"
  WEBHOOK_OUTBOX_MAX_RETRY_DELAY: "${WEBHOOK_OUTBOX_MAX_RETRY_DELAY:-60.0}"
  WEBHOOK_OUTBOX_DISPATCH_INTERVAL_SECONDS: "${WEBHOOK_OUTBOX_DISPATCH_INTERVAL_SECONDS:-5.0}"
  WEBHOOK_TENANT_QUEUE_BUCKETS: "${WEBHOOK_TENANT_QUEUE_BUCKETS:-16}"
  WEBHOOK_DELIVERY_RATE_LIMIT: "${WEBHOOK_DELIVERY_RATE_LIMIT:-120/m}"
  WEBHOOK_SECRET_ENCRYPTION_KEY: "${WEBHOOK_SECRET_ENCRYPTION_KEY:-replace-with-dedicated-secret-encryption-key}"
  DJANGO_LOG_LEVEL: "${DJANGO_LOG_LEVEL:-INFO}"
  CELERY_LOG_LEVEL: "${CELERY_LOG_LEVEL:-INFO}"
  WEBHOOK_LOG_LEVEL: "${WEBHOOK_LOG_LEVEL:-DEBUG}"
  LOG_FILE_MAX_BYTES: "${LOG_FILE_MAX_BYTES:-10485760}"
  LOG_FILE_BACKUP_COUNT: "${LOG_FILE_BACKUP_COUNT:-5}"
  DJANGO_SUPERUSER_BOOTSTRAP: "${DJANGO_SUPERUSER_BOOTSTRAP:-True}"
  DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME:-admin}"
  DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD:-admin}"
  DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL:-admin@example.com}"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rdash-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rdash_webhooks}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (Celery Broker)
  redis:
    image: redis:7-alpine
    container_name: rdash-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rdash-web
    command: >
      sh -c "python manage.py migrate &&
      python manage.py ensure_admin_user &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      <<: *app-environment
      POSTGRES_HOST: "postgres"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Worker (isolated from web server)
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rdash-celery-worker
    command: celery -A config worker -l ${CELERY_LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    environment:
      <<: *app-environment
      POSTGRES_HOST: "postgres"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rdash-celery-beat
    command: celery -A config beat -l ${CELERY_LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    environment:
      <<: *app-environment
      POSTGRES_HOST: "postgres"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: rdash-network
